<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KSA Admin / Export</title>
<link rel="stylesheet" href="desk.css"/>
</head>
<body>
<div id="loginGate">
  <div class="lg-card">
    <h2>Admin / Export</h2>
    <div class="lg-sub">All campuses · issued ADMs · staff · CSV</div>
    <form id="loginForm">
      <label>Email (admin)</label><input type="email" id="loginEmail" required/>
      <label>Password</label><input type="password" id="loginPassword" required/>
      <button class="primary" type="submit">Sign in</button>
      <div class="err" id="loginError"></div>
    </form>
  </div>
</div>
<div id="appRoot" style="display:none">
  <header>
    <div><h1>Admin / Export Desk</h1><div class="meta" id="headerMeta">—</div></div>
    <div class="hclock"><span class="htime" id="live-time">—</span><span id="live-date">—</span></div>
    <button class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.3)" id="btnLogout">Sign out</button>
  </header>
  <nav class="desks">
    <a href="index.html">Home</a><a href="finance.html">Finance</a>
    <a href="it.html">IT / Bio</a><a href="photo.html">Photo</a><a class="on" href="admin.html">Admin</a>
  </nav>
  <main>
    <div class="stats">
      <div class="stat"><div class="l">Students</div><div class="v" id="stCount">0</div></div>
      <div class="stat"><div class="l">Collected</div><div class="v" id="stCollected">0</div></div>
      <div class="stat"><div class="l">Bio</div><div class="v" id="stBio">0</div></div>
      <div class="stat"><div class="l">Photo</div><div class="v" id="stPhoto">0</div></div>
    </div>
    <div class="card">
      <h2>Import issued letter ADM</h2>
      <div class="grid">
        <div><label>Full ADM No</label><input id="iAdm" placeholder="NKR/HP/C1/001/2026"/></div>
        <div><label>Student name</label><input id="iName"/></div>
        <div><label>Campus</label><select id="iCampus"></select></div>
        <div><label>Programme</label><input id="iProg" placeholder="HP"/></div>
      </div>
      <button class="btn btn-gold" id="btnImport" type="button">Save issued ADM</button>
    </div>
    <div class="card">
      <h2>Create staff</h2>
      <div class="grid">
        <div><label>Email</label><input id="sEmail"/></div>
        <div><label>Password</label><input id="sPass" type="password"/></div>
        <div><label>Name</label><input id="sName"/></div>
        <div><label>Role</label>
          <select id="sRole"><option value="finance">finance</option><option value="it">it</option><option value="photo">photo</option><option value="principal">principal</option><option value="admin">admin</option></select>
        </div>
        <div><label>Campus</label><select id="sCampus"></select></div>
      </div>
      <button class="btn btn-gold" id="btnStaff" type="button">Create staff</button>
    </div>
    <div class="card">
      <h2>All students (with desk times)</h2>
      <button class="btn btn-outline" id="btnCsv" type="button">Download CSV</button>
      <div style="overflow-x:auto;margin-top:12px"><table>
        <thead><tr>
          <th>Campus</th><th>Letter ADM</th><th>Ground ADM</th><th>Name</th><th>Paid</th><th>Mode</th>
          <th>Finance at</th><th>Bio at</th><th>Photo at</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table></div>
    </div>
  </main>
</div>
<script type="module">
import { client, login, logout, getToken, getUser, fmtKes, fmtWhen, CONVEX_URL, fillCampusSelect, toast, startClock } from "./shared.js";
const $ = (id) => document.getElementById(id);
fillCampusSelect($("iCampus"));
fillCampusSelect($("sCampus"));
startClock();
let rowsCache = [];

function showApp() {
  const u = getUser();
  if (!u || !getToken() || u.role !== "admin") return;
  $("loginGate").style.display = "none"; $("appRoot").style.display = "";
  $("headerMeta").textContent = u.name + " · admin";
  refresh();
}
$("loginForm").onsubmit = async (e) => {
  e.preventDefault(); $("loginError").textContent = "";
  const res = await login($("loginEmail").value, $("loginPassword").value, undefined);
  if (!res.ok) { $("loginError").textContent = res.error; return; }
  if (res.role !== "admin") { $("loginError").textContent = "Admin only."; await logout(); return; }
  showApp();
};
$("btnLogout").onclick = async () => { await logout(); location.reload(); };

$("btnImport").onclick = async () => {
  try {
    await client.mutation("issued:upsert", {
      admNo: $("iAdm").value.trim(),
      studentName: $("iName").value.trim(),
      campusId: $("iCampus").value,
      programme: $("iProg").value.trim().toUpperCase(),
    });
    toast("Issued ADM saved");
  } catch (e) { toast(e.message || String(e), true); }
};

$("btnStaff").onclick = async () => {
  try {
    const res = await client.mutation("auth:createStaff", {
      token: getToken(),
      email: $("sEmail").value.trim(),
      password: $("sPass").value,
      name: $("sName").value.trim(),
      role: $("sRole").value,
      campusId: $("sRole").value === "admin" ? undefined : $("sCampus").value,
    });
    if (!res.ok) return toast(res.error || "Failed", true);
    toast("Staff created");
  } catch (e) { toast(e.message || String(e), true); }
};

$("btnCsv").onclick = () => {
  if (!rowsCache.length) return toast("No rows", true);
  const headers = [
    "campusId","letterAdmNo","groundAdmNo","admNo","studentName","programme","payMethod","amountPaid","balance","fee",
    "bioCaptured","photoSerial","phone","idNumber","financeAt","bioAt","photoAt"
  ];
  const lines = [headers.join(",")].concat(rowsCache.map(s => headers.map(h => {
    const v = s[h] ?? "";
    return '"' + String(v).replace(/"/g,'""') + '"';
  }).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = "ksa-reporting-export.csv";
  a.click();
};

async function refresh() {
  try {
    const t = await client.query("students:campusTotals", { token: getToken() });
    if (t) {
      $("stCount").textContent = t.count;
      $("stCollected").textContent = fmtKes(t.collected);
      $("stBio").textContent = t.bio;
      $("stPhoto").textContent = t.photo;
    }
    rowsCache = await client.query("students:listByCampus", { token: getToken() }) || [];
    $("tbody").innerHTML = rowsCache.map(s => `<tr>
      <td>${s.campusId}</td>
      <td style="font-size:11px">${s.letterAdmNo || s.admNo}</td>
      <td><span class="badge">${s.groundAdmNo || s.admNo}</span></td>
      <td>${s.studentName}</td>
      <td>${fmtKes(s.amountPaid)}</td>
      <td>${s.payMethod || "—"}</td>
      <td style="font-size:11px;white-space:nowrap">${fmtWhen(s.financeAt)}</td>
      <td style="font-size:11px;white-space:nowrap">${fmtWhen(s.bioAt)}</td>
      <td style="font-size:11px;white-space:nowrap">${fmtWhen(s.photoAt)}</td>
    </tr>`).join("") || "<tr><td colspan='9'>No data</td></tr>";
  } catch (e) { console.error(e); }
}

(function boot() {
  const u = getUser();
  if (getToken() && u?.role === "admin") showApp();
  else if (getToken() && u && u.role !== "admin") {
    const err = document.getElementById("loginError");
    if (err) err.textContent = "Signed in as " + u.role + ". Admin desk needs an admin account. Sign out first.";
  }
})();

</script>
</body>
</html>
